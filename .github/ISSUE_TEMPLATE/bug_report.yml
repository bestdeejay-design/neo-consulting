name: Bug report
description: Report a problem with the landing page
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue. Please fill in the fields below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and the expected behavior.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page / section
      description: Which section (e.g. #pricing) or URL is affected?
      placeholder: "#pricing"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - Mobile
        - Tablet
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 126"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Open the site
        2. Scroll to ...
        3. See ...
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional screenshots or a console error text.