name: meta-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Exactly one h1 on every page
        run: |
          for f in index.html materials/index.html materials/*.html presentation/index.html; do
            n=$(grep -c '<h1' "$f" || true)
            [ "$n" -eq 1 ] || { echo "$f: h1 count = $n"; exit 1; }
          done

      - name: All landing sections present
        run: |
          for id in hero problems solution services audience pricing process about team gallery guarantees cases reviews faq guides contacts; do
            grep -q "id=\"$id\"" index.html || { echo "missing section: $id"; exit 1; }
          done

      - name: No raw hex outside css/tokens.css
        run: |
          bad=$(grep -oE '#[0-9a-fA-F]{3,8}' index.html css/main.css js/main.js || true)
          if [ -n "$bad" ]; then echo "raw hex outside tokens:"; echo "$bad"; exit 1; fi

      - name: SEO files present
        run: |
          test -f robots.txt
          test -f sitemap.xml
          test -f 404.html
          test -f materials/feed.xml
          grep -q 'application/ld+json' index.html
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); ET.parse('materials/feed.xml')"

      - name: SEO audit (titles, canonicals, OG, JSON-LD, sitemap, RSS, no external assets)
        run: python3 scripts/seo_audit.py
