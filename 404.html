<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — НЕО КОНСАЛТИНГ</title>
  <meta name="description" content="Такой страницы нет. Перейдите на главную сайта «НЕО КОНСАЛТИНГ» или в раздел материалов по налогам и отчётности для ИП и ООО на УСН.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <style>
    :root {
      --ink: #1B1E1B;
      --ink-soft: #3F443F;
      --line: #D7DBD4;
      --bg: #F5F6F4;
      --surface: #FBFBF9;
      --accent: #2E5E4E;
      --accent-strong: #234A3D;
      --font-display: Georgia, "Charter", "Times New Roman", serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: var(--bg); color: var(--ink);
      font-family: var(--font-body); line-height: 1.6;
    }
    .card {
      max-width: 640px; width: 100%; background: var(--surface);
      border: 1px solid var(--line); border-radius: 14px; padding: 40px;
    }
    .code { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
    h1 { font-family: var(--font-display); font-size: clamp(28px, 5vw, 40px); line-height: 1.15; margin: 12px 0 16px; }
    p { color: var(--ink-soft); margin: 0 0 16px; }
    ul { display: flex; flex-wrap: wrap; gap: 12px; list-style: none; margin: 24px 0 0; padding: 0; }
    a.btn {
      display: inline-flex; align-items: center; min-height: 44px; padding: 11px 22px;
      border-radius: 8px; text-decoration: none; font-weight: 600;
      background: var(--accent); color: var(--surface);
    }
    a.btn:hover { background: var(--accent-strong); }
    a.btn--ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    a.btn--ghost:hover { background: var(--accent); color: var(--surface); }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">Ошибка 404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, адрес изменился или в ссылке опечатка. Ниже — рабочие разделы сайта «НЕО КОНСАЛТИНГ»: бухгалтерский аутсорсинг для ИП и ООО на УСН в Санкт-Петербурге.</p>
    <ul>
      <li><a class="btn" href="/neo-consulting/">На главную</a></li>
      <li><a class="btn btn--ghost" href="/neo-consulting/materials/">Материалы</a></li>
      <li><a class="btn btn--ghost" href="/neo-consulting/#contacts">Контакты</a></li>
    </ul>
  </main>
</body>
</html>
